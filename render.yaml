previews:
  generation: off

services:
  - type: web
    name: momento-a-dois-teste
    runtime: node
    region: virginia
    plan: free
    repo: https://github.com/tatyelopes/APPDOAMOR
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev --ignore-scripts --cache .npm-cache && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.20.0
      - key: HOST
        value: 0.0.0.0
      - key: STATIC_DIR
        value: dist
      - key: DATABASE_FILE
        value: /tmp/database.json
      - key: DATABASE_URL
        fromDatabase:
          name: momento-a-dois-feedback
          property: connectionString
      - key: MPV_EXPORT_TOKEN
        generateValue: true
      - key: MPV_FEEDBACK_RETENTION_DAYS
        value: '30'

databases:
  - name: momento-a-dois-feedback
    databaseName: mpv_feedback
    user: mpv_feedback
    plan: free
    region: virginia
    postgresMajorVersion: '18'
    ipAllowList: []
