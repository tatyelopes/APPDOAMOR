<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conectadois · Home e rotina diária · Protótipo</title>
<style>
:root{font-family:Arial,sans-serif;color:#2b2029;background:#f7efe6;--plum:#3d1f3d;--muted:#6f5a6b}*{box-sizing:border-box}body{margin:0}button,select,textarea{font:inherit}button,select{min-height:44px}button{cursor:pointer;border:0;border-radius:14px;padding:13px 20px;background:var(--plum);color:#fffaf5;font-weight:700}button:hover{filter:brightness(1.13)}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6b354d;outline-offset:4px}a{color:var(--plum)}.review{background:#241123;color:#fffaf5;padding:16px max(20px,calc((100% - 1080px)/2));font-size:14px}.review p{margin:0 0 12px}.review label{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.review select{border-radius:8px;max-width:100%;padding:8px}.shell{max-width:1080px;margin:auto;padding:24px 24px 115px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}.brand{font-family:Georgia,serif;font-size:27px;font-weight:bold;color:var(--plum)}.brand span{color:#88621a}.quiet{background:transparent;color:var(--plum);border:1px solid #bdaebe}.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:bold;color:var(--muted)}h1{font:normal clamp(30px,5vw,46px)/1.15 Georgia,serif;margin:12px 0}h2{font:normal 28px/1.2 Georgia,serif;margin:12px 0}h3{font-size:18px;margin:8px 0}p{line-height:1.6;color:var(--muted)}.intro{margin-bottom:28px}.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:24px}.hero{background:var(--plum);color:#fffaf5;border-radius:28px;padding:32px;min-height:300px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.hero p,.hero .eyebrow{color:#eedde7}.hero button{background:#f7efe6;color:var(--plum);margin-top:12px}.pill{display:inline-block;border:1px solid #a891a1;border-radius:30px;padding:7px 12px;font-size:12px}.routine,.panel{background:#fffaf5;border:1px solid #dacbd0;border-radius:24px;padding:26px}.routine ol{padding:0;list-style:none}.routine li{display:flex;gap:14px;padding:14px 0;color:var(--muted)}.dot{display:grid;place-items:center;background:#eee3ea;color:var(--plum);width:30px;height:30px;border-radius:50%;flex-shrink:0}.routine small{display:block;margin-top:6px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0 28px}.option{text-align:left;background:#fffaf5;color:var(--plum);border:1px solid #dacbd0;padding:24px}.option small{display:block;font-weight:normal;line-height:1.5;margin-top:10px}.gesture{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px;background:#e4eddf;border-radius:20px}.gesture p{margin-bottom:0;color:#344b37}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:20px;background:#fffaf5;border-top:1px solid #dacbd0;padding:10px 12px max(10px,env(safe-area-inset-bottom));z-index:2}nav button{background:transparent;color:var(--muted);font-weight:normal}nav button[aria-current]{color:var(--plum);background:#eee3ea;font-weight:bold}.form{max-width:640px;margin:auto}.form label{display:block;font-weight:bold;margin:20px 0 10px}.form select,.form textarea{width:100%;padding:14px;border:1px solid #bdaebe;border-radius:12px;background:#fffaf5;color:#2b2029}.form textarea{min-height:145px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.hint{padding:14px;border-radius:12px;background:#eee3ea;color:var(--plum);font-size:14px}.answer{white-space:pre-wrap;overflow-wrap:anywhere}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:650px){.shell{padding:20px 16px 110px}header{margin-bottom:28px}.layout,.options{grid-template-columns:1fr}.hero{padding:25px;min-height:280px}.gesture{align-items:flex-start;flex-direction:column}nav{gap:2px}nav button{padding:12px;font-size:14px}.review{padding:16px}.option{padding:20px}h2{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<aside class="review" aria-label="Controles do protótipo"><p><strong>Protótipo para revisão · Tarefa 24</strong> — Dados fictícios. Sem envio, salvamento ou conexão entre contas.</p><label for="scenario">Estado para revisão <select id="scenario"></select></label></aside>
<div class="shell"><header><div class="brand">conecta<span>dois</span></div><button class="quiet" data-destination="Perfil">Ana · Perfil</button></header><main id="main"></main></div>
<nav aria-label="Navegação principal"><button data-home aria-current="page">Início</button><button data-explore>Explorar</button><button data-destination="Nós">Nós</button><button data-destination="Perfil">Perfil</button></nav><div id="announcement" class="sr" role="status"></div>
<script>
const states={
 unpaired:['Sem vínculo','O primeiro passo é se encontrar por aqui.','Crie o espaço do casal ou use o convite que recebeu.','Criar nosso espaço','pair'],
 invited:['Convite pendente','Seu espaço está pronto.','Seu amor pode entrar quando quiser. Sem pressa.','Compartilhar convite','invite'],
 paired:['Recém-pareado','Agora este espaço é de vocês.','Uma conversa leve é um bom jeito de começar.','Fazer primeira atividade','setup'],
 mine:['Minha vez','Tem um momento esperando você.','Participe no seu ritmo. A resposta da outra pessoa continua privada.','Responder agora','answer'],
 waiting:['Esperando a outra pessoa','Sua parte está guardada.','A outra pessoa participa quando puder.','Acompanhar status','wait'],
 reveal:['Revelação pronta','Vocês já podem descobrir juntos.','As duas participações estão prontas. Abram um espaço para se escutar.','Ver juntos','reveal'],
 idle:['Sem atividade','Que tal alguns minutos de presença?','Escolham uma pergunta, um desafio ou um pouco dos dois.','Escolher momento','setup'],
 done:['Concluído hoje','Mais um momento vivido a dois.','Vocês podem ficar por aqui ou escolher algo novo.','Escolher outro momento','setup'],
 return:['Retorno após pausa','Que bom ter vocês por aqui.','Uma nova conversa pode começar no ritmo de vocês.','Escolher para hoje','setup'],
 loading:['Carregando','Preparando o espaço de vocês…','Só mais um instante para encontrar seu próximo passo.','',''],
 error:['Erro recuperável','Não foi possível atualizar seu espaço.','Tente novamente para encontrar seu próximo passo.','Tentar novamente','retry'],
 offline:['Sem conexão','Vamos retomar quando a conexão voltar.','Sua participação ainda não foi confirmada.','Tentar novamente','retry'],
 account:['Atenção à conta','Precisamos confirmar seu acesso.','Revise seu acesso para continuar no espaço do casal.','Revisar acesso','account']
};
const themes=['Filhos','Religioso','Apimentado','Descontraído','Papo sério','Memórias','Curiosidades','Carinho','Futuro','Valores','Parceria'];
const prompts={Filhos:'Que lembrança da infância você gosta de contar?',Religioso:'O que dá sentido à sua vida, com ou sem religião?',Apimentado:'Que detalhe de um encontro faz você sentir atração por mim?',Descontraído:'Qual seria o título de uma comédia sobre nós?', 'Papo sério':'Que necessidade sua eu poderia compreender melhor?',Memórias:'Qual lembrança nossa sempre faz você sorrir?',Curiosidades:'Que aventura você gostaria de viver comigo?',Carinho:'Qual pequeno gesto faz você se sentir cuidado(a)?',Futuro:'Que sonho você gostaria de construir comigo?',Valores:'Que valor você gostaria de cultivar na nossa relação?',Parceria:'Em qual situação você sente que formamos um time?'};
const challenges={Filhos:'Conte uma brincadeira de infância e ensine como brincar.',Religioso:'Compartilhe uma coisa pela qual sente gratidão hoje.',Apimentado:'Faça um elogio sobre algo que acha atraente na outra pessoa.',Descontraído:'Imite um personagem para a outra pessoa adivinhar.', 'Papo sério':'Escute por um minuto e resuma o que entendeu.',Memórias:'Escolham uma foto e contem o que lembram daquele dia.',Curiosidades:'Ensine à outra pessoa algo curioso que sabe.',Carinho:'Diga duas qualidades que admira na outra pessoa.',Futuro:'Escolham um pequeno sonho e seu primeiro passo.',Valores:'Conte uma atitude da outra pessoa que demonstra um valor que admira.',Parceria:'Escolham uma pequena tarefa e combinem como dividi-la.'};
const main=document.querySelector('#main'),selector=document.querySelector('#scenario');
let current='idle',theme='Descontraído',mode='questions',round=0,answer='',skipped=false,gestureHidden=false;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isChallenge=()=>mode==='challenges'||(mode==='mixed'&&round===1);
function render(html){main.innerHTML=html;const heading=main.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus()}}
function announce(text){document.querySelector('#announcement').textContent=text}
function go(state){current=state;selector.value=state;home()}
function home(){const [label,title,copy,cta,action]=states[current];const eligible=!['unpaired','invited','loading','error','offline','account'].includes(current);const ready=['reveal','done'].includes(current);const sent=ready||current==='waiting';
 render(`<section class="intro"><div class="eyebrow">Olá, Ana</div><h1>Um momento para vocês.</h1><p>Conversem, descubram e aproveitem o próprio ritmo.</p></section><div class="layout"><article class="hero"><span class="pill">${label}</span><h2>${title}</h2><p>${copy}</p>${eligible?`<span class="eyebrow">${esc(theme)} · ${isChallenge()?'Desafio':'Conversa'} · cerca de 5 min</span>`:''}${cta?`<button data-action="${action}">${cta} →</button>`:''}${current==='unpaired'?'<button data-destination="Entrar com convite">Tenho um convite</button>':''}</article><aside class="routine"><div class="eyebrow">No ritmo de vocês</div><h2>Pequenos momentos.<br>Boas descobertas.</h2><ol><li><span class="dot">1</span><span>Escolher<small>${eligible?'Um tema e um jeito de jogar':'Conectem suas contas para começar'}</small></span></li><li><span class="dot">2</span><span>Participar<small>${sent?'Sua participação está pronta':'Cada pessoa no próprio tempo'}</small></span></li><li><span class="dot">3</span><span>Descobrir<small>${ready?'Disponível para vocês':'Depois da participação dos dois'}</small></span></li></ol></aside></div>${eligible?`<section><h2>Outro jeito de se conectar</h2><div class="options"><button class="option" data-mode="questions">Perguntas discursivas<small>Uma conversa com suas próprias palavras.</small></button><button class="option" data-mode="challenges">Desafios<small>Pequenas ações para viver a dois.</small></button><button class="option" data-mode="mixed">Um pouco dos dois<small>Alternem conversa e ação.</small></button></div></section>${gestureHidden?'':`<aside class="gesture"><div><div class="eyebrow">Gesto opcional</div><h3>Conte algo que você admira no seu amor.</h3><p>Sem tarefa para cumprir. Só um convite ao carinho.</p></div><button class="quiet" data-dismiss>Agora não</button></aside>`}`:''}`)
}
function setup(){render(`<section class="form panel"><div class="eyebrow">Escolham antes de começar</div><h1>Que momento combina com hoje?</h1><p>Uma experiência de 3 a 10 minutos, sem pressa para terminar.</p><label for="theme">Tema</label><select id="theme">${themes.map(t=>`<option${t===theme?' selected':''}>${t}</option>`).join('')}</select><label for="mode">Formato</label><select id="mode"><option value="questions"${mode==='questions'?' selected':''}>Perguntas discursivas</option><option value="challenges"${mode==='challenges'?' selected':''}>Desafios</option><option value="mixed"${mode==='mixed'?' selected':''}>Perguntas e desafios</option></select><p>Cada pessoa participa na própria conta. Vocês podem pular qualquer atividade.</p><p class="hint">Demonstração de uma futura partida remota. A participação da outra conta será simulada.</p><div class="actions"><button data-start>Começar momento →</button><button class="quiet" data-home>Voltar ao Início</button></div></section>`)}
function participate(){const challenge=isChallenge();render(`<section class="form panel"><div class="eyebrow">${esc(theme)} · ${challenge?'Desafio':'Pergunta discursiva'} · ${round+1} de ${mode==='mixed'?2:1}</div><h1>${esc(challenge?challenges[theme]:prompts[theme])}</h1><p>${challenge?'Combinem antes o que é confortável para os dois. Cada pessoa confirma a própria parte.':'Sua resposta só será revelada depois da participação dos dois.'}</p>${challenge?'<button data-submit-challenge>Cumpri minha parte</button>':`<form id="answer-form"><label for="answer">Sua resposta</label><textarea id="answer" maxlength="500" required placeholder="Escreva com suas próprias palavras…">${esc(answer)}</textarea><p id="count">${answer.length}/500 caracteres</p><button id="submit-answer"${answer.trim()?'':' disabled'}>Guardar minha resposta</button></form>`}<div class="actions"><button class="quiet" data-skip>Pular atividade</button><button class="quiet" data-home>Sair por agora</button></div></section>`)}
function waiting(){render('<section class="form panel"><div class="eyebrow">Participação registrada nesta demonstração</div><h1>Sua parte está guardada.</h1><p>A outra pessoa participa quando puder. Você pode voltar ao Início.</p><div class="actions"><button data-home>Voltar ao Início</button><button class="quiet" data-simulate>Simular participação da outra conta</button></div></section>')}
function reveal(){render(`<section class="form panel"><div class="eyebrow">Revelação mútua · dados fictícios</div><h1>${isChallenge()?'Um desafio vivido a dois.':'Agora vocês podem se escutar.'}</h1><h3>Ana</h3><p class="answer">${esc(isChallenge()?'Cumpri minha parte.':answer||'Eu chamaria de “Uma aventura a dois”.')}</p><h3>Alex · resposta simulada</h3><p>${isChallenge()?'Cumpri minha parte.':'Gosto de inventar histórias divertidas sobre nós.'}</p><p>Não existe resposta certa. Aproveitem para conversar.</p><button data-next>${mode==='mixed'&&round===0?'Continuar para o desafio':'Concluir momento'}</button></section>`)}
function finish(){render(`<section class="form panel"><div class="eyebrow">No ritmo de vocês</div><h1>${skipped?'Momento encerrado.':'Mais um momento vivido a dois.'}</h1><p>${skipped?'Vocês pularam a última atividade. Tudo bem escolher outro momento depois.':'Uma conversa pequena também pode abrir espaço para uma descoberta.'}</p><button data-finish>Voltar ao Início</button></section>`)}
function destination(name){render(`<section class="form panel"><div class="eyebrow">Destino do fluxo · fora deste protótipo</div><h1>${esc(name)}</h1><p>Esta ação leva à área de ${esc(name.toLowerCase())} no aplicativo. Aqui, nenhuma alteração é realizada.</p><button data-home>Voltar ao Início</button></section>`)}
selector.innerHTML=Object.entries(states).map(([key,value])=>`<option value="${key}">${value[0]}</option>`).join('');selector.value=current;selector.addEventListener('change',()=>{answer='';round=0;mode='questions';theme='Descontraído';skipped=false;go(selector.value)});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 if(button.hasAttribute('data-home'))return home();if(button.hasAttribute('data-explore'))return setup();if(button.dataset.destination)return destination(button.dataset.destination);
 if(button.dataset.mode){mode=button.dataset.mode;return setup()}
 if(button.hasAttribute('data-start')){theme=document.querySelector('#theme').value;mode=document.querySelector('#mode').value;round=0;answer='';skipped=false;current='mine';selector.value=current;return participate()}
 if(button.hasAttribute('data-submit-challenge')){current='waiting';selector.value=current;return waiting()}
 if(button.hasAttribute('data-simulate'))return go('reveal');if(button.hasAttribute('data-dismiss')){gestureHidden=true;home();return announce('Gesto dispensado para esta demonstração.')}
 if(button.hasAttribute('data-next')||button.hasAttribute('data-skip')){skipped=button.hasAttribute('data-skip');if(mode==='mixed'&&round===0){round=1;answer='';current='mine';selector.value=current;return participate()}return finish()}
 if(button.hasAttribute('data-finish'))return go(skipped?'idle':'done');
 const actions={setup,answer:participate,wait:waiting,reveal,pair:()=>destination('Criar espaço'),invite:()=>destination('Compartilhar convite'),account:()=>destination('Revisar acesso'),retry:()=>{go('idle');announce('Recuperação simulada. Nenhuma consulta real foi feita.')}};actions[button.dataset.action]?.()
});
document.addEventListener('input',event=>{if(event.target.id==='answer'){answer=event.target.value;document.querySelector('#count').textContent=answer.length+'/500 caracteres';document.querySelector('#submit-answer').disabled=!answer.trim()}});
document.addEventListener('submit',event=>{if(event.target.id==='answer-form'){event.preventDefault();if(!answer.trim())return;current='waiting';selector.value=current;waiting()}});
home();
</script>
</body>
</html>
