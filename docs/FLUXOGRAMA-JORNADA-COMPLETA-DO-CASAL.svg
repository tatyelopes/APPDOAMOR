<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2600" viewBox="0 0 1800 2600" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma da jornada completa do casal no Conectadois</title>
  <desc id="desc">Jornada visual desde o gatilho e descoberta até convite, pareamento, experiência bilateral, hábito, Premium, pausa e saída segura.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f5e9ee"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d1f3d"/>
      <stop offset="1" stop-color="#6b354d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3d1f3d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#8d627f"/>
    </marker>
    <style>
      .title{font:700 54px Georgia,serif;fill:#fff8ef}.subtitle{font:400 24px Arial,sans-serif;fill:#ead9e3}.eyebrow{font:700 16px Arial,sans-serif;letter-spacing:3px;fill:#d4a94e}.phase{font:700 19px Arial,sans-serif;letter-spacing:1.4px;fill:#6b354d}.node-title{font:700 23px Arial,sans-serif;fill:#3d1f3d}.node-copy{font:400 17px Arial,sans-serif;fill:#725b6b}.small{font:400 15px Arial,sans-serif;fill:#725b6b}.white-title{font:700 24px Arial,sans-serif;fill:#fff8ef}.white-copy{font:400 17px Arial,sans-serif;fill:#ead9e3}.gold{fill:#d4a94e}.line{fill:none;stroke:#8d627f;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#b993aa;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}.pill{font:700 14px Arial,sans-serif;fill:#6b354d}.legend{font:400 16px Arial,sans-serif;fill:#5c4353}
    </style>
  </defs>

  <rect width="1800" height="2600" fill="url(#bg)"/>
  <rect x="70" y="55" width="1660" height="245" rx="42" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="130" y="115" class="eyebrow">CONECTADOIS · JORNADA BILATERAL E ASSÍNCRONA</text>
  <text x="130" y="183" class="title">Jornada completa do casal</text>
  <text x="130" y="230" class="subtitle">Da curiosidade ao hábito — com autonomia, reciprocidade e segurança em cada etapa.</text>
  <circle cx="1580" cy="176" r="72" fill="none" stroke="#d4a94e" stroke-width="3" opacity=".7"/>
  <circle cx="1638" cy="176" r="72" fill="none" stroke="#fff8ef" stroke-width="3" opacity=".7"/>
  <text x="1609" y="190" text-anchor="middle" style="font:700 37px Georgia,serif;fill:#d4a94e">2</text>

  <!-- trilha principal -->
  <path class="line" d="M900 430 L900 500"/><path class="line" d="M900 650 L900 720"/>
  <path class="line" d="M900 870 L900 940"/><path class="line" d="M900 1090 L900 1160"/>
  <path class="line" d="M900 1310 L900 1380"/><path class="line" d="M900 1530 L900 1600"/>
  <path class="line" d="M900 1750 L900 1820"/><path class="line" d="M900 1970 L900 2040"/>
  <path class="line" d="M900 2190 L900 2260"/>

  <!-- 1 -->
  <text x="170" y="365" class="phase">01 · DESCOBERTA</text>
  <rect x="500" y="340" width="800" height="90" rx="45" fill="#3d1f3d" filter="url(#shadow)"/>
  <text x="900" y="378" text-anchor="middle" class="white-title">Gatilho: “queria fazer algo diferente com nós dois”</text>
  <text x="900" y="407" text-anchor="middle" class="white-copy">Rotina, distância, nova fase, encontro ou vontade de se aproximar</text>

  <!-- 2 -->
  <text x="170" y="535" class="phase">02 · CONFIANÇA</text>
  <rect x="500" y="500" width="800" height="150" rx="28" fill="#fff" stroke="#d8c8d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="565" cy="575" r="34" fill="#f5e5c8"/><text x="565" y="584" text-anchor="middle" class="node-title">1</text>
  <text x="625" y="555" class="node-title">Descobre e avalia o Conectadois</text>
  <text x="625" y="588" class="node-copy">Entende diversão + conexão, duração, privacidade e preço por casal.</text>
  <text x="625" y="617" class="small">Decisão: a proposta parece leve, útil e segura?</text>
  <path class="dash" d="M500 575 C390 575 365 575 280 575"/>
  <rect x="85" y="518" width="195" height="114" rx="22" fill="#f6eff4" stroke="#b993aa" stroke-width="2"/>
  <text x="182" y="560" text-anchor="middle" class="node-title" font-size="19">Ainda não</text>
  <text x="182" y="588" text-anchor="middle" class="small">Abandona ou busca</text><text x="182" y="610" text-anchor="middle" class="small">outra alternativa</text>

  <!-- 3 -->
  <text x="170" y="755" class="phase">03 · INÍCIO</text>
  <rect x="500" y="720" width="800" height="150" rx="28" fill="#fff" stroke="#d8c8d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="565" cy="795" r="34" fill="#f5e5c8"/><text x="565" y="804" text-anchor="middle" class="node-title">2</text>
  <text x="625" y="775" class="node-title">Iniciadora cria conta e espaço privado</text>
  <text x="625" y="808" class="node-copy">Cadastro mínimo, conta individual e regras de autonomia claras.</text>
  <text x="625" y="837" class="small">Resultado: link ou código seguro com mensagem leve e editável.</text>

  <!-- 4 -->
  <text x="170" y="975" class="phase">04 · CONVITE</text>
  <rect x="500" y="940" width="800" height="150" rx="28" fill="#fff" stroke="#d8c8d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="565" cy="1015" r="34" fill="#f5e5c8"/><text x="565" y="1024" text-anchor="middle" class="node-title">3</text>
  <text x="625" y="995" class="node-title">Convidada entende antes de se cadastrar</text>
  <text x="625" y="1028" class="node-copy">Vê quem convidou, intenção, tempo, privacidade e uma amostra leve.</text>
  <text x="625" y="1057" class="small">Decisão livre: aceitar, recusar ou responder depois.</text>
  <path class="dash" d="M1300 1015 C1410 1015 1435 1015 1520 1015"/>
  <rect x="1520" y="958" width="195" height="114" rx="22" fill="#f6eff4" stroke="#b993aa" stroke-width="2"/>
  <text x="1617" y="999" text-anchor="middle" class="node-title" font-size="19">Sem pressão</text>
  <text x="1617" y="1027" text-anchor="middle" class="small">Recusa sem expor</text><text x="1617" y="1049" text-anchor="middle" class="small">motivo íntimo</text>

  <!-- 5 -->
  <text x="170" y="1195" class="phase">05 · PAREAMENTO</text>
  <rect x="500" y="1160" width="800" height="150" rx="28" fill="#fff" stroke="#d8c8d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="565" cy="1235" r="34" fill="#f5e5c8"/><text x="565" y="1244" text-anchor="middle" class="node-title">4</text>
  <text x="625" y="1215" class="node-title">Duas contas formam o espaço do casal</text>
  <text x="625" y="1248" class="node-copy">O sistema valida o convite e confirma o vínculo bilateral.</text>
  <text x="625" y="1277" class="small">Falhou? Corrigir código, expiração ou conta sem perder contexto.</text>

  <!-- 6 -->
  <text x="170" y="1415" class="phase">06 · PRIMEIRA EXPERIÊNCIA</text>
  <rect x="500" y="1380" width="800" height="150" rx="28" fill="#fff" stroke="#d4a94e" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="565" cy="1455" r="34" fill="#d4a94e"/><text x="565" y="1464" text-anchor="middle" class="node-title">5</text>
  <text x="625" y="1435" class="node-title">Escolhem uma atividade leve e rápida</text>
  <text x="625" y="1468" class="node-copy">Tema e intensidade aparecem antes; ambas podem trocar ou pular.</text>
  <text x="625" y="1497" class="small">A experiência não exige presença simultânea.</text>

  <!-- 7 -->
  <text x="170" y="1635" class="phase">07 · RECIPROCIDADE</text>
  <rect x="500" y="1600" width="800" height="150" rx="28" fill="url(#hero)" filter="url(#shadow)"/>
  <circle cx="565" cy="1675" r="34" fill="#d4a94e"/><text x="565" y="1684" text-anchor="middle" class="node-title">6</text>
  <text x="625" y="1655" class="white-title">Respostas individuais ficam seladas</text>
  <text x="625" y="1688" class="white-copy">O conteúdo só é revelado quando as duas pessoas concluem.</text>
  <text x="625" y="1717" class="white-copy">Até lá, o sistema mostra apenas um estado neutro de espera.</text>
  <path class="dash" d="M1300 1675 C1410 1675 1435 1675 1520 1675"/>
  <rect x="1520" y="1618" width="195" height="114" rx="22" fill="#f6eff4" stroke="#b993aa" stroke-width="2"/>
  <text x="1617" y="1659" text-anchor="middle" class="node-title" font-size="19">Uma não respondeu</text>
  <text x="1617" y="1687" text-anchor="middle" class="small">Esperar, lembrar ou</text><text x="1617" y="1709" text-anchor="middle" class="small">pausar sem punição</text>

  <!-- 8 -->
  <text x="170" y="1855" class="phase">08 · PRIMEIRO VALOR</text>
  <rect x="500" y="1820" width="800" height="150" rx="28" fill="#f5e5c8" stroke="#b98b35" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="565" cy="1895" r="34" fill="#3d1f3d"/><text x="565" y="1904" text-anchor="middle" class="white-title">7</text>
  <text x="625" y="1875" class="node-title">Revelação mútua, sem certo ou errado</text>
  <text x="625" y="1908" class="node-copy">Surpresa e curiosidade conduzem a uma continuação opcional.</text>
  <text x="625" y="1937" class="small">Valor real: conversa, descoberta ou carinho fora da tela.</text>
  <path class="dash" d="M500 1895 C390 1895 365 1895 280 1895"/>
  <rect x="85" y="1838" width="195" height="114" rx="22" fill="#f6eff4" stroke="#b993aa" stroke-width="2"/>
  <text x="182" y="1879" text-anchor="middle" class="node-title" font-size="19">Desconforto</text>
  <text x="182" y="1907" text-anchor="middle" class="small">Acolher, reportar,</text><text x="182" y="1929" text-anchor="middle" class="small">pular e ajustar</text>

  <!-- 9 -->
  <text x="170" y="2075" class="phase">09 · RETENÇÃO</text>
  <rect x="500" y="2040" width="800" height="150" rx="28" fill="#fff" stroke="#d8c8d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="565" cy="2115" r="34" fill="#f5e5c8"/><text x="565" y="2124" text-anchor="middle" class="node-title">8</text>
  <text x="625" y="2095" class="node-title">Retorno voluntário vira hábito flexível</text>
  <text x="625" y="2128" class="node-copy">Cadência, temas e profundidade se adaptam ao momento do casal.</text>
  <text x="625" y="2157" class="small">Meta: nova experiência em até 7 dias, com reciprocidade e conforto.</text>

  <!-- 10 -->
  <text x="170" y="2295" class="phase">10 · CONTINUIDADE</text>
  <rect x="500" y="2260" width="800" height="150" rx="28" fill="#fff" stroke="#d8c8d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="565" cy="2335" r="34" fill="#f5e5c8"/><text x="565" y="2344" text-anchor="middle" class="node-title">9</text>
  <text x="625" y="2315" class="node-title">Aprofundar, assinar, pausar ou sair</text>
  <text x="625" y="2348" class="node-copy">Premium só após valor; temas profundos exigem consentimento.</text>
  <text x="625" y="2377" class="small">Pausa, reativação, desvinculação e exclusão permanecem transparentes.</text>

  <!-- desfechos -->
  <path class="line" d="M900 2410 L900 2470"/>
  <rect x="325" y="2470" width="1150" height="86" rx="43" fill="#3d1f3d" filter="url(#shadow)"/>
  <text x="900" y="2507" text-anchor="middle" class="white-title">Um espaço seguro para continuar se descobrindo</text>
  <text x="900" y="2537" text-anchor="middle" class="white-copy">ou encerrar a jornada com autonomia e controle dos próprios dados.</text>

  <!-- legenda -->
  <rect x="85" y="2448" width="190" height="108" rx="20" fill="#fff" stroke="#e1d5dc"/>
  <circle cx="112" cy="2480" r="9" fill="#d4a94e"/><text x="132" y="2486" class="legend">momento de valor</text>
  <line x1="103" y1="2515" x2="123" y2="2515" stroke="#b993aa" stroke-width="3" stroke-dasharray="6 4"/><text x="132" y="2521" class="legend">desvio seguro</text>
</svg>
