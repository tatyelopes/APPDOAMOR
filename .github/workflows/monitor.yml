name: Monitoramento do MVP

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitoramento-mvp
  cancel-in-progress: true

jobs:
  readiness:
    name: Verificar serviço e banco
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Consultar prontidão com tentativas
        id: readiness
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          endpoint='https://momento-a-dois-teste.onrender.com/api/ready'
          for attempt in 1 2 3; do
            code="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --max-time 60 "$endpoint")"
            if [ "$code" = '200' ] && grep --quiet '"status":"ready"' response.json; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Abrir alerta se o serviço falhar
        if: steps.readiness.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[Monitoramento] MVP indisponível ou sem acesso ao banco'
            const { owner, repo } = context.repo
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            if (!issues.some((issue) => issue.title === title && !issue.pull_request)) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  'O monitor automático não recebeu uma resposta pronta do serviço após três tentativas.',
                  '',
                  `- Horário UTC: ${new Date().toISOString()}`,
                  `- Execução: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  '',
                  'Verifique o deploy, os logs estruturados e a conexão PostgreSQL. Não copie segredos ou conteúdo de feedback para esta issue.',
                ].join('\n'),
              })
            }

      - name: Encerrar alerta após recuperação
        if: steps.readiness.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[Monitoramento] MVP indisponível ou sem acesso ao banco'
            const { owner, repo } = context.repo
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            const issue = issues.find((item) => item.title === title && !item.pull_request)
            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Serviço e banco voltaram a responder em ${new Date().toISOString()}.`,
              })
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }
